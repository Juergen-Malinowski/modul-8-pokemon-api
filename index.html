<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/standard.css">
    <link rel="stylesheet" href="./css/style_desktop.css">
    <link rel="icon" href="./assets/img/favicon-pokemon.png" type="image/png" sizes="16x16">
    <link rel="stylesheet" href="./css/style_tablet.css">
    <link rel="stylesheet" href="./css/style_mobile.css">
</head>

<body class="main_grafik game_page">
    <header>
        <h1>P O K E D E X</h1>
        <div class="header_grafik">
            <div id="search_Mask" class="search_Mask"></div>
            <nav class="nav_grafik" aria-label="Main navigation">
                <a href="./index.html" class="start_grafik">HOME</a>
                <a href="./html/info.html" class="info_grafik">INFO</a>
            </nav>
        </div>
    </header>

    <main class="main_grafik">
        <div id="overview_poke" class="poke_grafik" aria-live="polite"></div>
        <div id="button_pre_next" class="button_pre_next"></div>

        <dialog id="show_one_pokemon" class="dialog_box" aria-label="Pokémon details">
            <div id="show_pokemon" class="show_pokemon"></div>
            <div id="poke_stats" class="poke_abilities"></div>

            <div class="control_grafik">
                <button id="pre_poke" class="buttons_pre_poke" type="button" aria-label="Previous Pokémon">
                    <img src="./assets/img/hand-left.png" alt="">
                </button>
                <button id="close_dialog" class="buttons_grafik buttons_dialog_grafik" type="button">CLOSE</button>
                <button id="next_poke" class="buttons_next_poke" type="button" aria-label="Next Pokémon">
                    <img src="./assets/img/hand-right.png" alt="">
                </button>
            </div>
        </dialog>

        <dialog id="show_search_one_pokemon" class="dialog_box" aria-label="Pokémon search result">
            <div id="show_search_pokemon" class="show_pokemon"></div>
            <div id="poke_search_stats" class="poke_abilities"></div>

            <div class="control_grafik_search">
                <button id="close_dialog_search" class="buttons_grafik buttons_dialog_grafik" type="button">CLOSE</button>
            </div>
        </dialog>
    </main>

    <footer>
        <p class="copyright_jm">© Jürgen Malinowski, 2025–2026</p>
    </footer>

    <script src="./js/definition.js"></script>
    <script src="./js/template.js"></script>
    <script src="./js/shorts.js"></script>
    <script src="./js/data.js"></script>
    <script src="./script.js"></script>
</body>

</html>
